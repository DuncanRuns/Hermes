# As Hermes supports many versions, I have my memory usage set to 16G. If this is not available to you, you can tweak the amount of memory, turn parallel off, or comment out versions in settings.gradle.kts
org.gradle.jvmargs=-Xmx16G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Mod properties
mod.version=0.15.1
mod.group=me.duncanruns.hermes
mod.id=hermes
mod.name=Hermes
# Global dependencies
deps.fabric_loader=0.19.2
deps.hermes-core=com.github.DuncanRuns:HermesCore:v0.3.2
# SpeedRunIGT is only being compiled against, so despite being a 1.16 specific branch commit, this should work for all versions
deps.speedrunigt=com.github.RedLime:SpeedRunIGT:f742cbaf81